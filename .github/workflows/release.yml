name: Build Extension

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'master' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve release tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Chrome build
        working-directory: dist
        run: zip -r ../chrome-${{ steps.get_tag.outputs.tag }}.zip .

      - name: Package Firefox build
        working-directory: dist
        run: zip -r ../firefox-${{ steps.get_tag.outputs.tag }}.zip .

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: chrome-${{ steps.get_tag.outputs.tag }}.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: firefox-${{ steps.get_tag.outputs.tag }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            chrome-${{ steps.get_tag.outputs.tag }}.zip
            firefox-${{ steps.get_tag.outputs.tag }}.zip
