<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SearXNG Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="content-wrapper">
      <div class="logo-container">
        <h1 class="searx-logo">Sear<span class="x-highlight">X</span>NG Home</h1>
      </div>

      <form id="search-form" class="search-form">
        <div class="search-input-wrapper">
          <input
            type="text"
            id="search-input"
            name="q"
            placeholder="Search..."
            autocomplete="off"
            autofocus
          />
          <button type="submit" aria-label="Search">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="18"
              viewBox="0 0 24 24"
              width="18"
              fill="currentColor"
            >
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </div>

        <div class="dropdown-wrapper">
          <select id="instance-select" aria-label="Select SearXNG Instance">
            <option value="">Loading instances from searx.space...</option>
          </select>
        </div>
      </form>
    </main>

    <script type="module" src="index.js"></script>
  </body>
</html>
